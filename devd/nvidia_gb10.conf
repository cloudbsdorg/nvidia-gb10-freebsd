# nvidia-gb10-freebsd: load the NVIDIA driver when vgapci(4) attaches to an
# NVIDIA display device (PCI vendor 0x10de), but only when rc.conf says
# nvidia_gb10_autoload="YES" (make configure sets it; make deinstall takes it
# out).  nvidia-drm pulls in nvidia-modeset, nvidia, drm and dmabuf through
# the module dependencies kldxref(8) recorded in /boot/modules; nvidia loads
# its GSP firmware module itself.  See nvidia(4).
attach 100 {
	device-name "vgapci[0-9]+";
	match "vendor" "0x10de";
	action "/usr/sbin/sysrc -c nvidia_gb10_autoload=YES && /sbin/kldload -n nvidia-drm";
};
