# nvidia-gb10-freebsd: load the NVIDIA driver when vgapci(4) attaches to an
# NVIDIA display device (PCI vendor 0x10de), but only when rc.conf says
# nvidia_gb10_autoload="YES" (make configure sets it; make deinstall takes it
# out).  nvidia.ko is loaded first.  It attaches to Ampere (RTX 30) and later
# GPUs only and refuses an older card when it probes it, so the
# rule then loads nvidia-drm only when this event's own card got an attached
# nvidia child: dev.nvidia.N.%parent names the vgapci(4) device it sits on.
# nvidia-drm pulls in nvidia-modeset, nvidia, drm and dmabuf through the
# module dependencies kldxref(8) recorded in /boot/modules; nvidia loads its
# GSP firmware module itself.  See nvidia(4).
#
# On a machine whose NVIDIA cards are all refused, nvidia.ko and the firmware
# modules it depends on stay loaded and idle; "kldunload nvidia" frees them
# and "sysctl hw.nvidia.refused" lists the refused cards.
#
# devd(8) expands $device-name to $'<value>', which is safe unquoted but wrong
# inside single quotes (devd.conf(5), "Notes on Variable Expansion"), so the
# variable sits outside the quotes below.  grep -w keeps vgapci1 from matching
# vgapci10.
attach 100 {
	device-name "vgapci[0-9]+";
	match "vendor" "0x10de";
	action "/usr/sbin/sysrc -c nvidia_gb10_autoload=YES && /sbin/kldload -n nvidia && /sbin/sysctl dev.nvidia 2>/dev/null | /usr/bin/grep -q -w -F '%parent: '$device-name && /sbin/kldload -n nvidia-drm";
};
